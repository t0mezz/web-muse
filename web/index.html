<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>web-muse</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="btn-sessions" title="Toggle sessions (Ctrl+B)" aria-label="Toggle sessions">◧</button>
    <div id="brand" title="web-muse — localhost bridge to muse serve">
      <span id="conn-dot" class="dot off" title="connection"></span>
      <span id="session-title">web-muse</span>
    </div>
    <select id="effort-picker" title="Reasoning effort (default for new chats)" aria-label="Reasoning effort"><option value="">effort…</option><option value="minimal">minimal</option><option value="low">low</option><option value="medium">medium</option><option value="high">high</option><option value="xhigh">xhigh</option><option value="max">max</option></select>
    <select id="model-picker" title="Model" aria-label="Model"><option value="">model…</option></select>
    <button id="btn-inspector" title="Toggle inspector (Ctrl+.)" aria-label="Inspector">ⓘ</button>
    <button id="btn-settings" title="Settings (Ctrl+,)" aria-label="Settings" aria-pressed="false"><svg viewBox="0 0 569.16 569.16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M513.217,216.366c-18.427,0-31.318-4.568-34.492-12.218c-3.17-7.647,2.702-19.982,15.704-32.999l33.109-33.109l6.493-6.493l-6.493-6.49l-83.474-83.44l-6.49-6.49l-6.49,6.49l-33.079,33.082c-14.422,14.419-24.076,16.573-28.547,16.573c-3.295,0-5.915-1.083-8.24-3.415c-3.151-3.161-8.434-11.5-8.391-31.864c0-0.386-0.021-0.768-0.067-1.147V9.18V0h-9.18H225.599h-9.18v9.18v46.931c-0.024,8.229-1.3,35.166-16.741,35.166c-4.464,0-14.104-2.154-28.519-16.576l-33.103-33.085l-6.49-6.487l-6.49,6.49l-83.44,83.44l-6.487,6.487l6.484,6.49l33.082,33.112c13.018,13.011,18.896,25.343,15.729,32.996c-3.17,7.65-16.046,12.222-34.446,12.222H9.18H0v9.18V343.58v9.18h9.18h46.815c18.396,0,31.273,4.568,34.443,12.219c3.173,7.656-2.705,20.004-15.722,33.025l-33.079,33.08l-6.49,6.49l6.49,6.492l83.44,83.475l6.493,6.496l6.494-6.496l33.097-33.113c14.407-14.4,24.049-16.551,28.51-16.551c15.45,0,16.726,26.918,16.75,35.168v46.936v9.18h9.18h117.984h9.18v-9.18v-45.662c0.046-0.377,0.067-0.752,0.067-1.135c-0.042-20.373,5.239-28.713,8.391-31.871c2.329-2.334,4.951-3.42,8.25-3.42c4.471,0,14.125,2.148,28.544,16.539l33.069,33.104l6.49,6.498l6.493-6.496l83.474-83.471l6.493-6.492l-6.496-6.494l-33.112-33.082c-12.999-13.023-18.871-25.373-15.698-33.023c3.174-7.648,16.065-12.215,34.489-12.215h46.761h9.18v-9.18V225.546v-9.18h-9.18H513.217z M413.1,284.58c0,70.867-57.653,128.52-128.52,128.52c-70.867,0-128.52-57.652-128.52-128.52c0-70.867,57.653-128.52,128.52-128.52C355.446,156.06,413.1,213.713,413.1,284.58z"/></svg></button>
    <a id="btn-progress" href="/progress.html" title="Live bridge status page" aria-label="Progress">⏱</a>
    <button id="btn-new" title="New session (/new)" aria-label="New session">＋</button>
  </header>

  <div id="layout">
    <aside id="sessions" aria-labelledby="sessions-h1">
      <h1 class="vh" id="sessions-h1">Sessions</h1>
      <div class="side-head">
        <span class="filter-box" hidden>
          <input id="session-filter" type="search" placeholder="Filter sessions…" aria-label="Filter sessions">
          <button id="btn-clear-filter" title="Clear filter" aria-label="Clear filter" hidden>✕</button>
        </span>
        <button id="selection-ticker" hidden type="button" class="ticker" aria-label="Selected sessions"></button>
        <button id="btn-delete-selected" hidden aria-label="Delete item" class="delete-button" title="Delete selected sessions">
          <svg class="trash-svg" viewBox="0 -10 64 74" xmlns="http://www.w3.org/2000/svg">
            <g id="trash-can">
              <rect x="16" y="24" width="32" height="30" rx="3" ry="3" fill="#e74c3c"></rect>
              <g transform-origin="12 18" id="lid-group">
                <rect x="12" y="12" width="40" height="6" rx="2" ry="2" fill="#c0392b"></rect>
                <rect x="26" y="8" width="12" height="4" rx="2" ry="2" fill="#c0392b"></rect>
              </g>
            </g>
          </svg>
        </button>
        <button id="btn-search-sessions" title="Search sessions" aria-label="Search sessions" aria-expanded="false">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
        </button>
        <button id="btn-refresh-sessions" title="Refresh list (/list)" aria-label="Refresh sessions">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>
        </button>
        <button id="btn-close-sessions" title="Close" aria-label="Close sessions">✕</button>
      </div>
      <div id="sess-count" class="session-count" role="status" hidden></div>
      <div id="selection-bar" hidden></div>
      <div id="session-list"></div>
    </aside>
    <div id="scrim" hidden></div>

    <main id="center">
      <div id="notice" hidden></div>
      <div id="toolbar">
        <span id="run-chip" class="chip idle" title="Turn state">idle</span>
        <button id="btn-older" title="Load older history">↑ older</button>
        <span id="tx-filters" role="group" aria-label="Transcript filter">
          <button data-txf="all" aria-pressed="true" title="Show everything">all</button>
          <button data-txf="edits" aria-pressed="false" title="Show file edits only">edits</button>
          <button data-txf="commands" aria-pressed="false" title="Show shell commands only">commands</button>
          <button data-txf="errors" aria-pressed="false" title="Show errors only">errors</button>
        </span>
        <span id="cursor-chip" class="chip dim" title="View cursor"></span>
        <span class="spacer"></span>
        <span id="sess-meta" class="dim"></span>
      </div>

      <section id="terminal" aria-label="Session transcript" aria-live="off"></section>
      <button id="jump-latest" hidden title="Jump to latest">↓ latest</button>

      <section id="cards" aria-label="Approvals and input requests"></section>

      <footer id="composer-wrap">
        <div id="slash-popup" hidden role="listbox" aria-label="Slash commands"></div>
        <div id="repo-bar" hidden>
          <div class="pill-wrap">
            <button id="repo-pill" class="repo-pill pearl" title="Attach a GitHub repo (/github)" aria-label="Select a GitHub repo" aria-haspopup="listbox">
              <span class="pearl-wrap">
                <span class="pearl-row">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                  <span id="repo-pill-label">select a repo</span>
                </span>
              </span>
            </button>
            <div id="repo-menu" class="repo-menu" hidden role="listbox" aria-label="GitHub repos"></div>
          </div>
          <div class="pill-wrap" id="branch-wrap" hidden>
            <button id="branch-pill" class="repo-pill pearl" title="Select a branch" aria-label="Select a branch" aria-haspopup="listbox">
              <span class="pearl-wrap">
                <span class="pearl-row">
                  <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="4" cy="4" r="2"/><circle cx="4" cy="12" r="2"/><circle cx="12" cy="8" r="2"/><path d="M4 6v4"/><path d="M12 10c0 1.5-2 2-4.5 2H6"/></svg>
                  <span id="branch-pill-label"></span>
                </span>
              </span>
            </button>
            <div id="branch-menu" class="repo-menu" hidden role="listbox" aria-label="Branches"></div>
          </div>
        </div>
        <form id="composer">
          <textarea id="input" rows="1" placeholder="Ask Muse…"
            aria-label="Prompt input" autocomplete="off" spellcheck="true"></textarea>
          <div class="composer-btns">
            <button type="button" id="btn-stop" title="Stop turn (/interrupt)" aria-label="Stop turn" disabled><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1.5"/></svg></button>
            <button type="submit" id="btn-send" title="Send (Enter)" aria-label="Send"><svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8.791045833333332 0.4881416666666667c-0.437525 -0.437525 -1.1480666666666666 -0.437525 -1.5855916666666667 0L1.6051416666666667 6.088454166666666c-0.437525 0.437525 -0.437525 1.1480666666666666 0 1.5855916666666667s1.1480666666666666 0.43752083333333336 1.5855916666666667 0l3.6892041666666664 -3.692708333333333v10.7386c0 0.6195333333333333 0.5005291666666667 1.1200625 1.1200625 1.1200625s1.1200625 -0.5005291666666667 1.1200625 -1.1200625V3.9813374999999995l3.6892041666666664 3.689208333333333c0.437525 0.43752083333333336 1.1480666666666666 0.43752083333333336 1.5855916666666667 0s0.43752083333333336 -1.1480666666666666 0 -1.5855916666666667L8.794545833333332 0.48464166666666664Z"/></svg></button>
          </div>
        </form>
        <section id="workflow-panel" class="open" hidden aria-label="Workflow progress">
          <button id="workflow-head" aria-expanded="true" aria-controls="workflow-body" title="Toggle workflow progress">
            <span id="workflow-caret" aria-hidden="true">▾</span>
            <span id="workflow-title">Workflow</span>
            <span id="workflow-count" role="status"></span>
          </button>
          <div id="workflow-meta" hidden>
            <span id="workflow-status" class="wf-pill"></span>
            <span id="workflow-def" class="wf-meta" title=""></span>
            <span id="workflow-runid" class="wf-meta" title=""></span>
            <span id="workflow-trigger" class="wf-meta"></span>
            <time id="workflow-started" class="wf-meta"></time>
            <span id="workflow-elapsed" class="wf-meta"></span>
          </div>
          <div id="workflow-annotations" hidden></div>
          <ol id="workflow-body"></ol>
        </section>
        <div id="hintbar">
          <span id="status">connecting…</span>
          <span id="sess-usage" title="Session tokens"></span>
          <span id="usage" title="Token usage"></span>
        </div>
      </footer>
    </main>

    <aside id="inspector" aria-label="Inspector">
      <div class="tabs" role="tablist">
        <button data-tab="approvals" class="tab active" role="tab">Approvals</button>
        <button data-tab="tools" class="tab" role="tab">Tools</button>
        <button data-tab="session" class="tab" role="tab">Session</button>
        <button id="btn-close-inspector" title="Close panel" aria-label="Close panel">✕</button>
      </div>
      <div id="tab-approvals" class="tabpanel"></div>
      <div id="tab-tools" class="tabpanel" hidden></div>
      <div id="tab-session" class="tabpanel" hidden>
        <div class="approval-ref">
          <span>Approval: <strong id="sess-approval-mode">onRequest</strong></span>
          <button id="btn-approval-settings" title="Change approval mode in Settings">Change in Settings</button>
        </div>
        <div class="row-btns">
          <button id="btn-compact" title="Compact session (/compact)">Compact</button>
          <button id="btn-usage" title="Refresh usage (/usage)">Usage</button>
          <button id="btn-pending" title="List pending approvals (/pending)">Pending</button>
        </div>
        <pre id="session-detail" class="detail"></pre>
      </div>
    </aside>

    <aside id="settings" aria-label="Settings" role="dialog" aria-modal="true">
      <div class="settings-box">
        <div class="settings-head">
          <strong>Settings</strong>
          <button id="btn-close-settings" title="Close settings (Esc)" aria-label="Close settings">✕</button>
        </div>
        <nav id="settings-nav" aria-label="Settings groups"></nav>
        <div id="settings-body" class="settings-body" role="tabpanel" tabindex="0"></div>
      </div>
    </aside>
  </div>
</div>
<div id="dir-dialog" hidden role="dialog" aria-modal="true" aria-label="Choose session directory">
  <div class="dir-box">
    <div class="dir-head">
      <strong>New session directory</strong>
      <button id="dir-cancel-x" title="Close" aria-label="Close">✕</button>
    </div>
    <div class="dir-pathrow">
      <input id="dir-path" type="text" spellcheck="false" autocomplete="off"
        placeholder="/absolute/path — paste to jump" aria-label="Directory path">
      <button id="dir-go" title="Go to typed path">Go</button>
    </div>
    <div id="dir-error" class="dir-error" hidden></div>
    <div class="dir-navrow">
      <button id="dir-up" title="Parent directory">↑ Up</button>
      <button id="dir-home" title="Server home directory">Home</button>
      <button id="dir-root" title="Filesystem root">/</button>
    </div>
    <div id="dir-crumbs" class="dir-crumbs" aria-label="Breadcrumb"></div>
    <div id="dir-list" class="dir-list" role="listbox" aria-label="Directory entries"></div>
    <div class="dir-foot">
      <button id="dir-default" title="Use the default per-session workspace">Use default workspace</button>
      <span class="spacer"></span>
      <button id="dir-cancel">Cancel</button>
      <button id="dir-use" class="primary" title="Start session in this folder">Use this folder</button>
    </div>
  </div>
</div>
<div id="toast" hidden role="status"></div>
<button id="stars-toggle" role="switch" aria-checked="false" aria-label="Toggle starfield" title="Toggle starfield"><span class="stars-thumb" aria-hidden="true"></span></button>
<script src="/theme.js"></script>
<script src="/stars.js"></script>
<script src="/settings.js"></script>
<script src="/app.js"></script>
</body>
</html>
